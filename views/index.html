<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Messaging App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --background-color: #f3f4f6;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        /* Login Form Styles */
        #login-form {
            width: 100%;
            max-width: 400px;
            margin: 40px auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px var(--shadow-color);
            transition: transform 0.2s;
        }

        #login-form:hover {
            transform: translateY(-2px);
        }

        #login-form h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Dashboard Styles */
        #dashboard {
            display: none;
            height: 100vh;
            flex-direction: column;
            background-color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--primary-color);
            color: white;
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            margin-left: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 4px #10b981;
        }

        .status-dot.disconnected {
            background-color: #ef4444;
        }

        /* Chat Box Styles */
        #chat-box {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            background-color: var(--background-color);
        }

        #messages {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #messages li {
            max-width: 48%;
            margin: 0.5rem 0;
            padding: 0.75rem 1rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 4px var(--shadow-color);
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out;
        }

        #messages li.user-message {
            background: var(--secondary-color);
            color: white;
            margin-left: auto;
            margin-right: 0; /* Keeps the message on the right */
            border-bottom-right-radius: 4px;
            border-bottom-left-radius: 0;
        }

        /* Style for messages from others */
        #messages li.other-message {
            background: white;
            color: black;
            margin-right: auto;
            margin-left: 0; /* Keeps the message on the left */
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 0;
        }

        /* Chat Controls Styles */
        #chat-controls {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-top: 1px solid var(--border-color);
        }

        #message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Button Styles */
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #5a67d8;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #login-form {
                margin: 20px;
                width: auto;
            }

            .header {
                padding: 0.75rem 1rem;
            }


            button {
                padding: 0.75rem 1rem;
            }
        }

    </style>
</head>
<body>
<div id="login-form">
    <h2 id="login-status">Login</h2>
    <div class="input-group">
        <input type="text" id="username" placeholder="Username">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="login()">Login</button>
    <div class="links">
        <a href="#" onclick="redirectToRegister(event)" class="link">Don't have an account? Register</a>
    </div>
</div>

<div id="dashboard">
    <div class="header">
        <div style="display: flex; align-items: center;">
            <h2>Chat Room</h2>
            <div class="connection-status" id="connection-status">
                <span class="status-dot disconnected" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
        <button onclick="logout()">Logout</button>
    </div>

    <div id="chat-box">
        <div id="empty-chat-message" style="text-align: center; padding: 2rem; color: #6b7280;">
            <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">💬 Welcome to Live Chat!</p>
            <p style="font-size: 0.9rem;">This is a <strong>real-time chat</strong> where you can chat with other users.</p>
            <p style="font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.8;">
                💡 <strong>Tip:</strong> Open this page in another browser/tab with a different user to test live chatting!
            </p>
        </div>
        <ul id="messages" style="display: none;">
            <!-- Chat messages will appear here -->
        </ul>
    </div>

    <div id="chat-controls">
        <input type="text" id="message-input" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let socket;
    let pendingMessages = [];
    let retryLogoutCount = 0;
    let lastSentMessage = null; // Track last sent message to prevent duplicates
    const gatewayBaseUrl = (() => {
        const protocol = window.location.protocol || 'http:';
        const hostname = window.location.hostname && window.location.hostname !== '' ? window.location.hostname : 'localhost';
        const port = window.location.port;
        if (!port || port === '' || port === '8080' || port === '8082') {
            return `${protocol}//${hostname}:3000`;
        }
        return `${protocol}//${hostname}${port ? `:${port}` : ''}`;
    })();

    // Check if JWT is stored in sessionStorage
    document.addEventListener('DOMContentLoaded', function() {
        if ('Notification' in window) {
            if (Notification.permission === 'granted') {
                console.log("Notification permission already granted.");
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        console.log("Notification permission granted.");
                    }
                });
            }
        } else {
            console.log('This browser does not support notifications.');
        }

        const storedToken = sessionStorage.getItem('jwtToken');
        if (storedToken) {
            showDashboard();
            setupWebSocket();
        }
    });

    // Login function
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        fetch(`${gatewayBaseUrl}/user/v1/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        })
            .then(response => response.json())
            .then(data => {
                if (data.message === "success" && data.data.token) {
                    sessionStorage.setItem('jwtToken', data.data.token);
                    sessionStorage.setItem('refreshToken', data.data.refresh_token);
                    sessionStorage.setItem('username', data.data.username);
                    sessionStorage.setItem('fullname', data.data.full_name);
                    document.getElementById('login-status').innerText = 'Login successful!';
                    showDashboard();
                    setupWebSocket();
                } else {
                    alert(data.message)
                }
            })
            .catch(err => {
                alert(err)
            });
    }
    function redirectToRegister() {
        window.location.href = `${gatewayBaseUrl}/register`;
    }

    // Logout function
    function logout() {
        fetch(`${gatewayBaseUrl}/user/v1/logout`, {
            method: 'DELETE',
            headers: {
                'Authorization': sessionStorage.getItem('jwtToken')
            }
        })
            .then(response => {
                if (response.status === 401) {
                    retryLogoutCount++;
                    if (retryLogoutCount <= 3) {
                        return refreshToken().then(() => logout());
                    }
                    throw new Error("Max retry limit reached for logout.");
                }
                return response.json();
            })
            .then(data => {
                if (data.message === "success") {
                    sessionStorage.removeItem('jwtToken');
                    sessionStorage.removeItem('refreshToken');
                    sessionStorage.removeItem('username');
                    sessionStorage.removeItem('fullname');
                    window.alert("Logout successful!");
                    location.reload();
                } else {
                    window.alert("Logout failed!");
                }
            })
            .catch(err => {
                window.alert("Logout failed!");
            });
    }

    function refreshToken() {
        return fetch(`${gatewayBaseUrl}/user/v1/refresh-token`, {
            method: 'POST',
            headers: {
                'Authorization': sessionStorage.getItem('refreshToken')
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.message === "success" && data.data.token) {
                    sessionStorage.setItem('jwtToken', data.data.token);
                }
            })
            .catch(err => {
                console.error('Error refreshing token:', err);
            });
    }

    function fetchMessageHistory() {
        fetch(`${gatewayBaseUrl}/message/v1/history`, {
            method: 'GET',
            headers: {
                'Authorization': `${sessionStorage.getItem('jwtToken')}`
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                if (data.data && data.data.length > 0) {
                    const emptyMessage = document.getElementById('empty-chat-message');
                    const messagesList = document.getElementById('messages');
                    if (emptyMessage && messagesList) {
                        emptyMessage.style.display = 'none';
                        messagesList.style.display = 'block';
                    }
                    data.data.forEach(message => {
                        addMessageToChat(message.from, message.message);
                    });
                }
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
    }

    function setupWebSocket() {
        // Get WebSocket host from template or use fallback
        let appName = "{{ .awsPublicIP }}";
        const shouldAutoDetect = !appName || appName.trim() === '' || appName === "{{ .awsPublicIP }}";
        if (shouldAutoDetect) {
            const hostname = window.location.hostname;
            appName = hostname && hostname !== '' ? hostname : 'localhost';
        }
        const wsUrl = `ws://${appName}:9000/message/v1/send`;
        console.log('Connecting to WebSocket:', wsUrl);
        socket = new WebSocket(wsUrl);

        socket.onopen = function(event) {
            console.log('Connected to WebSocket server.');
            // Update connection status
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            if (statusDot && statusText) {
                statusDot.classList.remove('disconnected');
                statusDot.classList.add('connected');
                statusText.textContent = 'Live Chat Connected';
            }
            fetchMessageHistory()
            pendingMessages.forEach(message => {
                socket.send(message);
            });
            pendingMessages = [];
        };

        socket.onmessage = function(event) {
            let message;
            try {
                message = JSON.parse(event.data);
            } catch (e) {
                console.error('Failed to parse WebSocket message:', e, event.data);
                return;
            }
            
            const currentUser = sessionStorage.getItem('fullname');
            
            console.log('Received message:', message);
            console.log('Current user:', currentUser);
            console.log('Message from:', message.from);
            
            // Check if this is an error message
            if (message.error) {
                console.error('WebSocket error message:', message.error);
                // Don't display error messages as chat messages
                return;
            }
            
            // Validate message structure
            if (!message.from || !message.message) {
                console.warn('Invalid message format:', message);
                return;
            }
            
            // Skip if this is our own message that we already displayed optimistically
            // But only skip if it's the exact same message we just sent
            if (message.from === currentUser && lastSentMessage && 
                lastSentMessage.from === message.from && 
                lastSentMessage.message === message.message &&
                (Date.now() - lastSentMessage.timestamp) < 2000) { // Only skip if sent within last 2 seconds
                console.log('Skipping duplicate own message');
                // Clear the tracking after a short delay
                setTimeout(() => {
                    if (lastSentMessage && 
                        lastSentMessage.from === message.from && 
                        lastSentMessage.message === message.message) {
                        lastSentMessage = null;
                    }
                }, 1000);
                return;
            }
            
            // Always show messages from other users
            if (message.from !== currentUser) {
                console.log('Displaying message from other user:', message.from);
            }
            
            showNotification(message.from, message.message);
            addMessageToChat(message.from, message.message);
        };

        socket.onclose = function(event) {
            console.log('Disconnected from WebSocket server.');
            // Update connection status
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            if (statusDot && statusText) {
                statusDot.classList.remove('connected');
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Reconnecting...';
            }
            // Optionally attempt to reconnect after a delay
            setTimeout(function() {
                if (socket.readyState === WebSocket.CLOSED) {
                    console.log('Attempting to reconnect WebSocket...');
                    setupWebSocket();
                }
            }, 3000);
        };

        socket.onerror = function(error) {
            console.error('WebSocket error:', error);
            console.error('Failed to connect to:', wsUrl);
            // Error will be handled by onclose event for reconnection
        };
    }

    function showNotification(title, message) {
        if (Notification.permission === "granted") {
            const notification = new Notification(title, {
                body: message
            });

            notification.onclick = function() {
                window.focus();
            };
        }
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const message = input.value;

        if (message.trim() !== '') {
            const currentUser = sessionStorage.getItem('fullname');
            const msgObject = {
                from: currentUser, 
                message: message
            };

            const messageToSend = JSON.stringify(msgObject);

            // Track the message we're sending to prevent duplicates
            lastSentMessage = {
                from: currentUser,
                message: message,
                timestamp: Date.now()
            };

            // Optimistically display the message immediately
            addMessageToChat(currentUser, message);

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(messageToSend);
            } else {
                pendingMessages.push(messageToSend);
            }

            input.value = '';
        }
    }

    function addMessageToChat(from, message) {
        const messagesList = document.getElementById('messages');
        const emptyMessage = document.getElementById('empty-chat-message');
        
        // Hide empty message and show messages list when first message arrives
        if (emptyMessage && messagesList.children.length === 0) {
            emptyMessage.style.display = 'none';
            messagesList.style.display = 'block';
        }
        
        const newMessage = document.createElement('li');

        const currentUser = sessionStorage.getItem('fullname');
        const isCurrentUser = from === currentUser;
        
        if (isCurrentUser) {
            newMessage.classList.add('user-message');
        } else {
            newMessage.classList.add('other-message');
        }

        // Format timestamp
        const now = new Date();
        const timeString = now.toLocaleTimeString('id-ID', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });

        // Format message dengan timestamp
        if (isCurrentUser) {
            newMessage.innerHTML = `
                <div style="text-align: right;">
                    <strong>${from}</strong>
                    <span style="font-size: 0.75rem; opacity: 0.8; margin-left: 0.5rem;">${timeString}</span>
                </div>
                <div style="margin-top: 0.25rem;">${message}</div>
            `;
        } else {
            newMessage.innerHTML = `
                <div>
                    <strong>${from}</strong>
                    <span style="font-size: 0.75rem; opacity: 0.8; margin-left: 0.5rem;">${timeString}</span>
                </div>
                <div style="margin-top: 0.25rem;">${message}</div>
            `;
        }
        
        messagesList.appendChild(newMessage);

        // Auto scroll to bottom
        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showDashboard() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
    }

    // Add event listener for Enter key in message input
    document.getElementById('message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Add event listener for Enter key in login form
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });
</script>
</body>
</html>
